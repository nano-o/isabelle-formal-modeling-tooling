# Project descriptor for the Isabelle formal-modeling tooling.
# Data only: key=value, one per line, never sourced. Generated by new-project.sh;
# see the tooling repository's README for every key.
format_version=1
source_rel=@SOURCE_REL@
formal_rel=@FORMAL_REL@
tooling_revision=@TOOLING_REVISION@
build_session=@SESSION@
session_dir=@SESSION@
# ic2 starts from the base logic, never the project session: as the logic,
# project theories would be heap nodes without per-command diagnostics.
ic2_base_session=HOL
ic2_max_heap=@MAX_HEAP@
isabelle_version=@ISABELLE_VERSION@
# Differential testing (see the isabelle-differential skill): uncomment once
# the session exports a code-level model.
#export_name=@SESSION@.Theory:code/model.ML
#model_dispatch=differential/model_dispatch.ML
#audit_collection=export_audit
