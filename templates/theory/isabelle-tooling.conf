# Project descriptor for the Isabelle formal-modeling tooling.
# Data only: key=value, one per line, never sourced. Generated by
# `isabelle-tooling init`; see the tooling repository's README for every key.
# tooling_revision is the pin: change it with `isabelle-tooling update REV`.
format_version=1
# A theory project: Isabelle theories with no implementation to model.
model_kind=theory
source_rel=@SOURCE_REL@
formal_rel=@FORMAL_REL@
tooling_revision=@TOOLING_REVISION@
build_session=@SESSION@
session_dir=@SESSION@
# ic2 starts from the base logic, never the project session: as the logic,
# project theories would be heap nodes without per-command diagnostics.
ic2_base_session=HOL
ic2_max_heap=@MAX_HEAP@
isabelle_version=@ISABELLE_VERSION@
